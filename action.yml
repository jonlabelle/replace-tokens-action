name: Replace tokens action
description: A GitHub Action that replaces tokens in files, similar to envsubst
author: Jon LaBelle
branding:
  icon: repeat
  color: green

inputs:
  paths:
    description: >-
      File path or paths to process.
      Specify multiple paths on separate lines using a multiline string `|`.
      Wildcards are supported.
      Defaults to the current directory (`.`).
      Example: `./path/to/my/settings.json`
    required: false
    default: '.'

  style:
    description: >-
      Token style to replace.
      Accepted values are `mustache` (for example, `{{ VARIABLE }}`), `handlebars` (for example, `{{ VARIABLE }}`), `brackets` (for example, `< VARIABLE >`), `hashes` (for example, `## VARIABLE ##`), `underscores` (for example, `__ VARIABLE __`), `envsubst` (for example, `${VARIABLE}`), and `make` (for example, `$(VARIABLE)`).
      Defaults to `mustache`.
    required: false
    default: 'mustache'

  filter:
    description: >-
      Filter applied to the resolved `paths` results.
      Supports only `*` and `?` wildcards.
      Example: `*.json`
    required: false

  exclude:
    description: >-
      File or directory names and patterns to exclude from the results.
      Wildcards are supported.
      Specify multiple exclusions on separate lines using a multiline string `|`.
      Example: `*dev*.json`
    required: false

  recurse:
    description: >-
      Whether to search subdirectories recursively.
      Defaults to `false`.
    required: false
    default: 'false'

  depth:
    description: >-
      Maximum recursion depth.
      Valid only when `recurse` is enabled.
      A value of `0` means no depth limit.
    required: false
    default: '0'

  encoding:
    description: >-
      File encoding to use when reading and writing files.
      Defaults to `auto`, which attempts to preserve the file's existing encoding.
      Accepted values: `auto`, `utf8`, `utf8BOM`, `ascii`, `ansi`, `bigendianunicode`, `bigendianutf32`, `oem`, `unicode`, `utf32`
    required: false
    default: 'auto'

  no-newline:
    description: >-
      Do not append a trailing newline to the file.
      By default, an existing trailing newline is preserved and a newline is
      appended only when the file does not already end with one, using the
      file's detected line ending style when possible.
    required: false
    default: 'false'

  dry-run:
    description: >-
      Preview changes without modifying files.
      Shows what would change.
      By default, files are modified.
    required: false
    default: 'false'

  fail:
    description: >-
      Fail the step if no files were changed.
      When `dry-run` is enabled, fail if no files would change.
    required: false
    default: 'false'

  fail-on-skipped:
    description: >-
      Fail the step if one or more tokens are skipped because a matching value
      was missing or empty.
    required: false
    default: 'false'

  case-insensitive:
    description: >-
      Match environment variable names without regard to case on all platforms.
      Defaults to `false`, which preserves the platform default behavior.
    required: false
    default: 'false'

  verbose:
    description: >-
      Enable verbose output.
      By default, verbose output is suppressed.
    required: false
    default: 'false'

outputs:
  tokens-replaced:
    description: Total number of tokens replaced or that would be replaced in dry-run mode.
    value: ${{ steps.replace-tokens.outputs.tokens-replaced }}
  tokens-skipped:
    description: Total number of tokens skipped because no matching value was available.
    value: ${{ steps.replace-tokens.outputs.tokens-skipped }}
  modified-files-count:
    description: Number of files updated by the action.
    value: ${{ steps.replace-tokens.outputs.modified-files-count }}
  would-modify-files-count:
    description: Number of files that would be updated in dry-run mode.
    value: ${{ steps.replace-tokens.outputs.would-modify-files-count }}

runs:
  using: composite
  steps:
    - id: replace-tokens
      name: Replace tokens (PowerShell Core)
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        PATHS_INPUT: ${{ inputs.paths }}
        EXCLUDE_INPUT: ${{ inputs.exclude }}
        FILTER_INPUT: ${{ inputs.filter }}
        STYLE_INPUT: ${{ inputs.style }}
        ENCODING_INPUT: ${{ inputs.encoding }}
        RECURSE_INPUT: ${{ inputs.recurse }}
        DEPTH_INPUT: ${{ inputs.depth }}
        NO_NEWLINE_INPUT: ${{ inputs.no-newline }}
        DRY_RUN_INPUT: ${{ inputs.dry-run }}
        FAIL_INPUT: ${{ inputs.fail }}
        FAIL_ON_SKIPPED_INPUT: ${{ inputs.fail-on-skipped }}
        CASE_INSENSITIVE_INPUT: ${{ inputs.case-insensitive }}
        VERBOSE_INPUT: ${{ inputs.verbose }}
      run: |
        $pathsInput = $env:PATHS_INPUT
        $excludeInput = $env:EXCLUDE_INPUT
        $filterInput = $env:FILTER_INPUT
        $styleInput = $env:STYLE_INPUT
        $encodingInput = $env:ENCODING_INPUT

        $scriptPath = Join-Path -Path $env:ACTION_PATH -ChildPath 'action.ps1'
        & $scriptPath `
          -PathsInput $pathsInput `
          -Style $styleInput `
          -Filter $filterInput `
          -ExcludeInput $excludeInput `
          -Recurse $env:RECURSE_INPUT `
          -Depth $env:DEPTH_INPUT `
          -Encoding $encodingInput `
          -NoNewline $env:NO_NEWLINE_INPUT `
          -DryRun $env:DRY_RUN_INPUT `
          -Fail $env:FAIL_INPUT `
          -FailOnSkipped $env:FAIL_ON_SKIPPED_INPUT `
          -CaseInsensitive $env:CASE_INSENSITIVE_INPUT `
          -VerboseInput $env:VERBOSE_INPUT
