# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Reusable test gate: one full Pester run per platform/shell combination.
# Token styles are test cases, not matrix jobs. Composite action smoke tests
# share these runners with the helper's cross-platform compatibility tests.

name: Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shell: [pwsh]
        include:
          - os: windows-latest
            shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install Pester
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester tests
        timeout-minutes: 5
        run: |
          Import-Module -Name Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./Tests -Output Detailed -CI

      - name: Set up composite action smoke tests
        id: setup
        run: |
          $stubs = Join-Path -Path (Join-Path -Path $pwd -ChildPath Tests) -ChildPath stubs
          $pristine = Join-Path -Path (Join-Path -Path $stubs -ChildPath pristine) -ChildPath mustache.tpl
          $subject = Join-Path -Path $env:RUNNER_TEMP -ChildPath subject.tpl
          $dryRunSubject = Join-Path -Path $env:RUNNER_TEMP -ChildPath dry-run-subject.tpl
          $untouched = Join-Path -Path $env:RUNNER_TEMP -ChildPath untouched.tpl
          Copy-Item -Path $pristine -Destination $subject
          Copy-Item -Path $pristine -Destination $dryRunSubject
          Copy-Item -Path (Join-Path -Path (Join-Path -Path $stubs -ChildPath untouched) -ChildPath no-matches.tpl) -Destination $untouched

          Add-Content -Path $env:GITHUB_OUTPUT -Value "subject-path=$subject" -Encoding UTF8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dry-run-path=$dryRunSubject" -Encoding UTF8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "untouched-path=$untouched" -Encoding UTF8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "original-hash=$((Get-FileHash -Path $dryRunSubject -Algorithm SHA256).Hash)" -Encoding UTF8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "untouched-hash=$((Get-FileHash -Path $untouched -Algorithm SHA256).Hash)" -Encoding UTF8

      # The composite action always uses pwsh; Pester above tests action.ps1
      # directly under the selected shell, including Windows PowerShell 5.1.
      - name: Perform token replacement through the composite action
        id: replace
        uses: ./
        with:
          paths: |
            ${{ steps.setup.outputs.subject-path }}
            ${{ steps.setup.outputs.untouched-path }}
          style: mustache
          fail: true
          no-newline: true
          verbose: true
        env:
          NAME: jon
          _NAME: shadow

      - name: Perform dry-run through the composite action
        id: dry-run
        uses: ./
        with:
          paths: ${{ steps.setup.outputs.dry-run-path }}
          style: mustache
          dry-run: true
          fail: true
          no-newline: true
        env:
          NAME: jon
          _NAME: shadow

      - name: Assert composite action results and outputs
        env:
          SUBJECT_PATH: ${{ steps.setup.outputs.subject-path }}
          DRY_RUN_PATH: ${{ steps.setup.outputs.dry-run-path }}
          UNTOUCHED_PATH: ${{ steps.setup.outputs.untouched-path }}
          ORIGINAL_HASH: ${{ steps.setup.outputs.original-hash }}
          UNTOUCHED_HASH: ${{ steps.setup.outputs.untouched-hash }}
          MODIFIED_COUNT: ${{ steps.replace.outputs.modified-files-count }}
          WOULD_MODIFY_COUNT: ${{ steps.replace.outputs.would-modify-files-count }}
          REPLACED_COUNT: ${{ steps.replace.outputs.tokens-replaced }}
          SKIPPED_COUNT: ${{ steps.replace.outputs.tokens-skipped }}
          DRY_RUN_MODIFIED_COUNT: ${{ steps.dry-run.outputs.modified-files-count }}
          DRY_RUN_WOULD_MODIFY_COUNT: ${{ steps.dry-run.outputs.would-modify-files-count }}
          DRY_RUN_REPLACED_COUNT: ${{ steps.dry-run.outputs.tokens-replaced }}
          DRY_RUN_SKIPPED_COUNT: ${{ steps.dry-run.outputs.tokens-skipped }}
        run: |
          $stubs = Join-Path -Path (Join-Path -Path $pwd -ChildPath Tests) -ChildPath stubs
          $expected = Join-Path -Path (Join-Path -Path $stubs -ChildPath expected) -ChildPath replaced.tpl
          if ((Get-Content -Path $expected -Raw) -cne (Get-Content -Path $env:SUBJECT_PATH -Raw)) {
            throw 'Token replacement did not match the expected fixture.'
          }
          if ((Get-FileHash -Path $env:UNTOUCHED_PATH -Algorithm SHA256).Hash -ne $env:UNTOUCHED_HASH) {
            throw 'Token replacement modified the untouched fixture.'
          }
          if ((Get-FileHash -Path $env:DRY_RUN_PATH -Algorithm SHA256).Hash -ne $env:ORIGINAL_HASH) {
            throw 'Dry-run modified the input file.'
          }
          if ($env:MODIFIED_COUNT -ne '1' -or $env:WOULD_MODIFY_COUNT -ne '1' -or $env:REPLACED_COUNT -ne '6' -or $env:SKIPPED_COUNT -ne '2') {
            throw 'Token replacement returned unexpected counts.'
          }
          if ($env:DRY_RUN_MODIFIED_COUNT -ne '0' -or $env:DRY_RUN_WOULD_MODIFY_COUNT -ne '1' -or $env:DRY_RUN_REPLACED_COUNT -ne '6' -or $env:DRY_RUN_SKIPPED_COUNT -ne '0') {
            throw 'Dry-run returned unexpected counts.'
          }
